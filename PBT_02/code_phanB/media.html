<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Công Nghệ Tương Lai</title>
    <link rel="stylesheet" href="css\media.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <svg width="40" height="40" viewBox="0 0 100 100">
                <rect x="10" y="10" width="80" height="80" rx="15" fill="#007bff" />
                <circle cx="50" cy="50" r="25" fill="white" />
            </svg>
            <h1>Công Nghệ Tương Lai</h1>
        </div>

        <div class="music-control">
            <audio id="bgMusic" loop>
                <source src="music/Người Im Lặng Gặp Người Hay Nói.mp3" type="audio/mpeg">
            </audio>
            <button id="musicBtn">Mở nhạc nền</button>
        </div>
    </header>

    <main>
        <section class="product-grid">
            <figure>
                <img src="img/iphone.jpg" alt="iPhone 15 Pro" loading="lazy">
                <figcaption>iPhone 15 Pro Max — Công nghệ Titan</figcaption>
            </figure>
            <figure>
                <img src="img/macbook.jpg" alt="MacBook Pro" loading="lazy">
                <figcaption>MacBook Pro M3 — Sức mạnh vượt trội</figcaption>
            </figure>
            <figure>
                <img src="img/airport.jpg" alt="AirPods Pro" loading="lazy">
                <figcaption>AirPods Pro — Âm thanh đỉnh cao</figcaption>
            </figure>
        </section>

        <section class="media-section">
        <h2>Video Review Sản Phẩm</h2>
        
        <div class="video-slider-wrapper" 
            id="videoSlider" 
            data-videos="hLcPljC8mFU,mnpWx3ikibo,q5QITi036SE">
            
            <button class="nav-arrow left" onclick="prevVideo()">&#10094;</button>
            <div class="video-container">
                <iframe id="reviewIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <button class="nav-arrow right" onclick="nextVideo()">&#10095;</button>
        </div>
        
        <p id="videoStatus">Video 1 / 3</p>
        </section>

        <section class="media-section">
        <h2>Từ Nhà Sản Xuất</h2>
        <video controls poster="img/poster_mac.jpg" preload="metadata">
            <source src="video/iphonewebm.webm" type="video/webm">
            
            <source src="video/iphonemp4.mp4" type="video/mp4">
            
            <p>Trình duyệt của bạn không hỗ trợ xem video trực tiếp. 
                <a href="video/iphonemp4.mp4">Tải video về máy</a> để xem.
            </p>
        </video>
        </section>
    </main>

    <script src="script\media.js"></script>
</body>
</html>
