<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab - So sánh Box-sizing</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <h1>Phần 1: Chứng minh content-box vs border-box</h1>
    
    <div class="wrapper">
        <div class="box box-content">
            <h3>Hộp 1</h3>
            <p>box-sizing: <b>content-box</b></p>
            <p>Width: 300px</p>
            <p>Padding: 20px</p>
            <p>Border: 5px</p>
        </div>

        <div class="box box-border">
            <h3>Hộp 2</h3>
            <p>box-sizing: <b>border-box</b></p>
            <p>Width: 300px</p>
            <p>Padding: 20px</p>
            <p>Border: 5px</p>
        </div>
    </div>
</body>
</html>
