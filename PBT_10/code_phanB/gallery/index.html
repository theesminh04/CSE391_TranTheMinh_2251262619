<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Infinite Scroll Gallery</h1>
        <p>Cuộn xuống để tự động tải thêm ảnh</p>
    </header>

    <main>
        <div id="gallery" class="gallery"></div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Đang tải thêm...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="load-trigger"></div>
    </main>

    <div id="lightbox" class="lightbox hidden">
        <button id="closeLightbox" class="close-btn">&times;</button>
        <img id="lightboxImage" src="" alt="Ảnh lớn">
        <p id="lightboxCaption"></p>
    </div>

    <script src="./app.js"></script>
</body>
</html>
